name: iOS

# The iPhone build. Xcode only exists on a Mac and this project is developed on Windows, so every
# compile happens here. Manual only: a macOS minute can cost ten of a free allowance.
#
#   mode=sim  debug build, run in the iOS Simulator: a screenshot and the app's output (`sim`).
#   mode=ipa  release build, packaged as an unsigned .ipa (`ipa`). Sideloadly signs it on install.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to do
        required: true
        default: ipa
        type: choice
        options: [ipa, sim]

concurrency:
  group: ios
  cancel-in-progress: true

permissions:
  contents: read

env:
  APPLE: src-tauri/gen/apple
  PROJECT: limusic-app.xcodeproj
  SCHEME: limusic-app_iOS
  BUNDLE_ID: com.limusic.mobile

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # First and cheap: under a minute, against the many a Rust build takes.
      - name: Type-check the Swift
        run: |
          xcrun --sdk iphoneos swiftc -typecheck \
            -target arm64-apple-ios16.4 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            "$APPLE"/Sources/limusic-app/*.swift

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ios-${{ inputs.mode }}
          cache-on-failure: true

      - name: Build the UI
        run: cd ui && pnpm install --frozen-lockfile && pnpm build

      - name: Xcode project tools
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Pick the build
        run: |
          if [ "${{ inputs.mode }}" = sim ]; then
            echo "TRIPLE=aarch64-apple-ios-sim" >> "$GITHUB_ENV"
            echo "PROFILE_DIR=debug" >> "$GITHUB_ENV"
            echo "CARGO_PROFILE=" >> "$GITHUB_ENV"
            echo "CONFIG=debug" >> "$GITHUB_ENV"
            echo "SDK=iphonesimulator" >> "$GITHUB_ENV"
          else
            echo "TRIPLE=aarch64-apple-ios" >> "$GITHUB_ENV"
            echo "PROFILE_DIR=release" >> "$GITHUB_ENV"
            echo "CARGO_PROFILE=--release" >> "$GITHUB_ENV"
            echo "CONFIG=release" >> "$GITHUB_ENV"
            echo "SDK=iphoneos" >> "$GITHUB_ENV"
          fi

      - name: Build the Rust library
        run: |
          TAURI_CONFIG="$(cat src-tauri/tauri.ios.conf.json)" \
            cargo build $CARGO_PROFILE --target "$TRIPLE" --lib -p limusic-app \
            --features tauri/custom-protocol --locked
          mkdir -p "$APPLE/Externals/arm64/$CONFIG" "$APPLE/assets"
          cp "target/$TRIPLE/$PROFILE_DIR/libapp_lib.a" "$APPLE/Externals/arm64/$CONFIG/libapp.a"

      - name: Build the app
        run: |
          cd "$APPLE"
          xcodegen generate
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration "$CONFIG" -sdk "$SDK" \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -60
          test "${PIPESTATUS[0]}" -eq 0
          cp -R "build/derived/Build/Products/$CONFIG-$SDK/Limusic.app" "$RUNNER_TEMP/Limusic.app"

      - name: Package the .ipa
        if: inputs.mode == 'ipa'
        run: |
          mkdir -p "$RUNNER_TEMP/out/Payload"
          cp -R "$RUNNER_TEMP/Limusic.app" "$RUNNER_TEMP/out/Payload/"
          cd "$RUNNER_TEMP/out" && zip -qry Limusic.ipa Payload && ls -la Limusic.ipa

      - name: Upload the .ipa
        if: inputs.mode == 'ipa'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ipa
          path: ${{ runner.temp }}/out/Limusic.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Run in the Simulator
        if: inputs.mode == 'sim'
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          runtimes = sorted((r for r in devices if 'iOS' in r), key=lambda r: [int(x) for x in r.rsplit('iOS-', 1)[1].split('-')])
          print(next(d['udid'] for d in devices[runtimes[-1]] if d['name'].startswith('iPhone')))
          ")
          mkdir -p "$RUNNER_TEMP/sim"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b >/dev/null
          xcrun simctl install "$UDID" "$RUNNER_TEMP/Limusic.app"
          SIMCTL_CHILD_LIMUSIC_SMOKE=1 xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" \
            > "$RUNNER_TEMP/sim/console.log" 2>&1 &
          # In step with runSmokeSteps in LimusicBridge.swift.
          shot() { xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/sim/$1.png"; }
          sleep 20; shot home
          sleep 25; shot playing
          sleep 8;  shot search
          sleep 10; shot library
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "Limusic"' \
            > "$RUNNER_TEMP/sim/system.log" 2>&1 || true
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          find "$DATA" -name '*.log' -exec cp {} "$RUNNER_TEMP/sim/" \; || true
          find "$DATA/Library/Logs" -type f -name '*' -exec cp {} "$RUNNER_TEMP/sim/" \; 2>/dev/null || true
          find "$DATA" -maxdepth 4 > "$RUNNER_TEMP/sim/container.txt"

      - name: Upload the Simulator results
        if: always() && inputs.mode == 'sim'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sim
          path: ${{ runner.temp }}/sim
          if-no-files-found: warn
          retention-days: 7
